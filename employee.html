<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ملف الموظف - Shassiha HR</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
rel="stylesheet">


<style>

/* =========================
   GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}


/* =========================
   HEADER
========================= */

.header{

    background:#ff7a00;

    color:white;

    padding:18px 25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:
        0 3px 10px rgba(0,0,0,.12);

}

.header h1{
    margin:0;
    font-size:22px;
}

.header a{

    color:white;

    text-decoration:none;

    font-size:14px;

}


/* =========================
   CONTAINER
========================= */

.container{

    max-width:1100px;

    margin:25px auto;

    padding:0 15px;

}


/* =========================
   PROFILE
========================= */

.profile{

    background:white;

    border-radius:18px;

    padding:25px;

    display:flex;

    align-items:center;

    gap:20px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.07);

    margin-bottom:20px;

}


.avatar{

    width:80px;

    height:80px;

    border-radius:50%;

    background:#fff0e5;

    color:#ff7a00;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:38px;

    flex-shrink:0;

}


.profile-info h2{

    margin:0 0 5px;

    font-size:24px;

}


.profile-info p{

    margin:3px 0;

    color:#777;

}


.employee-id{

    color:#ff7a00 !important;

    font-weight:bold;

}


/* =========================
   STATUS
========================= */

.status{

    display:inline-block;

    padding:6px 14px;

    border-radius:20px;

    font-size:12px;

    margin-top:6px;

}


.active{

    background:#e7f7ed;

    color:#16833b;

}


.inactive{

    background:#ffe5e5;

    color:#c62828;

}


.leave{

    background:#fff4dc;

    color:#a56a00;

}


/* =========================
   SECTION
========================= */

.section{

    background:white;

    border-radius:16px;

    padding:22px;

    margin-bottom:18px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);

}


.section h3{

    margin:0 0 18px;

    padding-bottom:10px;

    border-bottom:1px solid #eee;

    color:#333;

}


/* =========================
   INFO GRID
========================= */

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

}


.info{

    background:#fafafa;

    padding:14px;

    border-radius:10px;

}


.info label{

    display:block;

    font-size:12px;

    color:#888;

    margin-bottom:4px;

}


.info span{

    font-weight:600;

}


/* =========================
   NOTES
========================= */

.notes{

    background:#fafafa;

    padding:15px;

    border-radius:10px;

    min-height:60px;

    line-height:1.8;

}


/* =========================
   ACTIONS
========================= */

.actions{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

}


.btn{

    border:none;

    padding:12px 18px;

    border-radius:10px;

    font-family:inherit;

    cursor:pointer;

    font-size:14px;

}


.primary{

    background:#ff7a00;

    color:white;

}


.green{

    background:#16833b;

    color:white;

}


.blue{

    background:#2878d0;

    color:white;

}


.dark{

    background:#333;

    color:white;

}


.red{

    background:#c62828;

    color:white;

}


/* =========================
   LOADING
========================= */

.loading{

    background:white;

    border-radius:16px;

    padding:50px;

    text-align:center;

    color:#777;

}


/* =========================
   ERROR
========================= */

.error{

    background:#ffe5e5;

    color:#c62828;

    border-radius:16px;

    padding:40px;

    text-align:center;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .profile{

        flex-direction:column;

        text-align:center;

    }


    .info-grid{

        grid-template-columns:1fr;

    }


    .actions{

        flex-direction:column;

    }


    .btn{

        width:100%;

    }


    .header{

        flex-direction:column;

        gap:8px;

        text-align:center;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>
        👤 ملف الموظف
    </h1>

    <a href="employees.html">
        ← العودة للموظفين
    </a>

</div>



<div
    class="container"
    id="content">

    <div class="loading">

        ⏳ جاري تحميل بيانات الموظف...

    </div>

</div>



<script>


// =====================================================
// API
// =====================================================

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";



// =====================================================
// EMPLOYEE ID
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const employeeId =
    params.get("id");



// =====================================================
// LOAD EMPLOYEE
// =====================================================

async function loadEmployee(){

    const content =
        document.getElementById(
            "content"
        );


    if(!employeeId){

        content.innerHTML = `

            <div class="error">

                ❌ لم يتم تحديد رقم الموظف

            </div>

        `;

        return;

    }


    try{

        const response =
            await fetch(

                API,

                {

                    method:"POST",

                    body:
                        JSON.stringify({

                            action:
                                "getEmployees"

                        })

                }

            );


        const data =
            await response.json();


        if(
            data.status !==
            "success"
        ){

            throw new Error(
                data.message ||
                "حدث خطأ"
            );

        }


        const employee =
            data.employees.find(

                e =>

                String(
                    e["Employee ID"]
                ) ===
                String(employeeId)

            );


        if(!employee){

            content.innerHTML = `

                <div class="error">

                    ❌ الموظف غير موجود

                    <br><br>

                    رقم الموظف:

                    ${safe(employeeId)}

                </div>

            `;

            return;

        }


        renderEmployee(
            employee
        );


    }

    catch(error){

        content.innerHTML = `

            <div class="error">

                ❌ تعذر تحميل بيانات الموظف

                <br><br>

                ${safe(
                    error.message
                )}

            </div>

        `;

    }

}



// =====================================================
// RENDER EMPLOYEE
// =====================================================

function renderEmployee(e){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = `


<!-- =========================
     PROFILE
========================= -->

<div class="profile">


    <div class="avatar">

        👤

    </div>


    <div class="profile-info">


        <h2>

            ${safe(
                e["الاسم"]
            )}

        </h2>


        <p>

            ${safe(
                e["الوظيفة"]
            )}

            —

            ${safe(
                e["القسم"]
            )}

        </p>


        <p class="employee-id">

            🆔

            ${safe(
                e["Employee ID"]
            )}

        </p>


        ${statusBadge(
            e["الحالة"]
        )}


    </div>

</div>



<!-- =========================
     PERSONAL
========================= -->

<div class="section">

    <h3>
        👤 المعلومات الشخصية
    </h3>


    <div class="info-grid">


        ${info(
            "الاسم",
            e["الاسم"]
        )}


        ${info(
            "تاريخ الميلاد",
            formatDate(
                e["تاريخ الميلاد"]
            )
        )}


        ${info(
            "رقم البطاقة الوطنية",
            e["رقم البطاقة الوطنية"]
        )}


        ${info(
            "العنوان",
            e["العنوان"]
        )}


    </div>

</div>



<!-- =========================
     JOB
========================= -->

<div class="section">

    <h3>
        💼 المعلومات الوظيفية
    </h3>


    <div class="info-grid">


        ${info(
            "رقم الموظف",
            e["Employee ID"]
        )}


        ${info(
            "القسم",
            e["القسم"]
        )}


        ${info(
            "الوظيفة",
            e["الوظيفة"]
        )}


        ${info(
            "الراتب",
            formatNumber(
                e["الراتب"]
            )
        )}


        ${info(
            "تاريخ التعيين",
            formatDate(
                e["تاريخ التعيين"]
            )
        )}


        ${info(
            "الحالة",
            e["الحالة"]
        )}


    </div>

</div>



<!-- =========================
     CONTRACT
========================= -->

<div class="section">

    <h3>
        📄 معلومات العقد
    </h3>


    <div class="info-grid">


        ${info(
            "نوع العقد",
            e["نوع العقد"]
        )}


        ${info(
            "تاريخ انتهاء العقد",
            formatDate(
                e["تاريخ انتهاء العقد"]
            )
        )}


    </div>

</div>



<!-- =========================
     CONTACT
========================= -->

<div class="section">

    <h3>
        📞 معلومات الاتصال
    </h3>


    <div class="info-grid">


        ${info(
            "الهاتف",
            e["الهاتف"]
        )}


        ${info(
            "العنوان",
            e["العنوان"]
        )}


    </div>

</div>



<!-- =========================
     EMERGENCY
========================= -->

<div class="section">

    <h3>
        🚨 معلومات الطوارئ
    </h3>


    <div class="info-grid">


        ${info(
            "جهة اتصال للطوارئ",
            e["جهة اتصال للطوارئ"]
        )}


        ${info(
            "رقم هاتف الطوارئ",
            e["رقم هاتف الطوارئ"]
        )}


    </div>

</div>



<!-- =========================
     NOTES
========================= -->

<div class="section">

    <h3>
        📝 الملاحظات
    </h3>


    <div class="notes">

        ${
            safe(
                e["ملاحظات"]
            ) ||
            "لا توجد ملاحظات"
        }

    </div>

</div>



<!-- =========================
     ACTIONS
========================= -->

<div class="section">

    <h3>
        ⚡ إجراءات الموظف
    </h3>


    <div class="actions">


        <button
            class="btn primary"
            onclick="editEmployee()">

            ✏️ تعديل البيانات

        </button>


        <button
            class="btn green"
            onclick="directEmployee()">

            📄 كتاب مباشرة

        </button>


        <button
            class="btn blue"
            onclick="leaveEmployee()">

            🏖️ إجازة

        </button>


        <button
            class="btn dark"
            onclick="warningEmployee()">

            ⚠️ إنذار

        </button>


        <button
            class="btn red"
            onclick="endEmployee()">

            🔴 إنهاء خدمة

        </button>


        <button
            class="btn dark"
            onclick="window.print()">

            🖨️ طباعة

        </button>


    </div>

</div>

`;

}



// =====================================================
// INFO
// =====================================================

function info(label,value){

    return `

        <div class="info">

            <label>

                ${safe(label)}

            </label>

            <span>

                ${safe(value) || "-"}

            </span>

        </div>

    `;

}



// =====================================================
// STATUS
// =====================================================

function statusBadge(status){

    if(status === "مستمر"){

        return `

            <span class="status active">

                🟢 مستمر

            </span>

        `;

    }


    if(status === "إجازة"){

        return `

            <span class="status leave">

                🟠 إجازة

            </span>

        `;

    }


    if(status === "منتهي الخدمة"){

        return `

            <span class="status inactive">

                🔴 منتهي الخدمة

            </span>

        `;

    }


    return `

        <span class="status">

            ${safe(status)}

        </span>

    `;

}



// =====================================================
// FORMAT NUMBER
// =====================================================

function formatNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "";

    }


    const number =
        Number(
            String(value)
                .replace(/,/g,"")
        );


    if(
        isNaN(number)
    ){

        return value;

    }


    return number.toLocaleString(
        "en-US"
    );

}



// =====================================================
// FORMAT DATE
// =====================================================

function formatDate(value){

    if(!value){

        return "";

    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return value;

    }


    return date.toLocaleDateString(
        "en-GB"
    );

}



// =====================================================
// SAFE
// =====================================================

function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// =====================================================
// ACTIONS
// =====================================================

function editEmployee(){

    alert(
        "✏️ تعديل بيانات الموظف\n\n" +
        "راح نفعل تعديل البيانات بالمرحلة القادمة."
    );

}


function directEmployee(){

    alert(
        "📄 كتاب مباشرة\n\n" +
        "راح نسوي نموذج الكتاب بالمرحلة القادمة."
    );

}


function leaveEmployee(){

    alert(
        "🏖️ الإجازة\n\n" +
        "راح نربطها بسجل الإجازات."
    );

}


function warningEmployee(){

    alert(
        "⚠️ الإنذار\n\n" +
        "راح نسوي سجل إنذارات للموظف."
    );

}


function endEmployee(){

    alert(
        "🔴 إنهاء الخدمة\n\n" +
        "راح نسوي إجراء إنهاء الخدمة والكتاب الرسمي."
    );

}



// =====================================================
// START
// =====================================================

loadEmployee();

</script>


</body>

</html>
