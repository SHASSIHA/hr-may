<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الحضور والغياب - Shassiha HR</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f9;
    font-family:'Cairo',sans-serif;
    color:#222;
}

.header{
    background:#ff7a00;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1300px;
    margin:25px auto;
    padding:0 15px;
}

.date-bar{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.date-title{
    font-size:18px;
    font-weight:bold;
}

.today{
    color:#ff7a00;
    margin-right:8px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    text-align:center;
}

.stat-icon{
    font-size:30px;
}

.stat-title{
    color:#777;
    margin-top:5px;
    font-size:13px;
}

.stat-number{
    font-size:27px;
    font-weight:bold;
    margin-top:5px;
}

.total{color:#333;}
.present{color:#16833b;}
.absent{color:#c62828;}
.late{color:#a56a00;}
.leave{color:#2878d0;}

.toolbar{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.search{
    flex:1;
    min-width:220px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:11px 14px;
    font-family:inherit;
    outline:none;
}

.search:focus{
    border-color:#ff7a00;
}

.date-input{
    border:1px solid #ddd;
    border-radius:10px;
    padding:11px 14px;
    font-family:inherit;
    outline:none;
}

.date-input:focus{
    border-color:#ff7a00;
}

.refresh{
    border:none;
    background:#333;
    color:white;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
}

.refresh:hover{
    opacity:.9;
}

.table-card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

thead{
    background:#fff3e9;
}

th{
    padding:14px;
    text-align:center;
    font-size:13px;
    color:#555;
    white-space:nowrap;
}

td{
    padding:13px;
    border-top:1px solid #eee;
    text-align:center;
    font-size:13px;
}

tr:hover td{
    background:#fafafa;
}

.employee-name{
    font-weight:bold;
}

.department{
    color:#777;
    font-size:12px;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.status-present{
    background:#e7f7ed;
    color:#16833b;
}

.status-absent{
    background:#ffe5e5;
    color:#c62828;
}

.status-late{
    background:#fff4dc;
    color:#a56a00;
}

.status-leave{
    background:#e6f0ff;
    color:#2878d0;
}

.status-none{
    background:#f1f1f1;
    color:#777;
}

.actions{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:7px 11px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-size:11px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-present{
    background:#16833b;
    color:white;
}

.btn-out{
    background:#2878d0;
    color:white;
}

.btn-absent{
    background:#c62828;
    color:white;
}

.btn-late{
    background:#d18b00;
    color:white;
}

.btn-leave{
    background:#555;
    color:white;
}

.btn-save{
    background:#ff7a00;
    color:white;
}

.empty,
.loading{
    padding:50px;
    text-align:center;
    color:#777;
}

.message{
    position:fixed;
    bottom:20px;
    left:20px;
    right:20px;
    max-width:500px;
    margin:auto;
    padding:14px 18px;
    border-radius:12px;
    color:white;
    text-align:center;
    font-size:14px;
    display:none;
    z-index:9999;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.message.success{
    background:#16833b;
}

.message.error{
    background:#c62828;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9998;
    padding:15px;
}

.modal-box{
    background:white;
    width:100%;
    max-width:520px;
    border-radius:18px;
    padding:25px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.modal-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
    color:#555;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-family:inherit;
    outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#ff7a00;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-actions button{
    flex:1;
}

.btn-cancel{
    background:#eee;
    color:#333;
}

@media(max-width:700px){

    .header{
        padding:15px;
    }

    .header h1{
        font-size:18px;
    }

    .date-bar{
        flex-direction:column;
        align-items:flex-start;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        padding:15px;
    }

    .stat-number{
        font-size:23px;
    }

}

</style>

</head>

<script>

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";

let employees = [];
let attendance = [];

let editingRow = null;

function getToday(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}

function displayDate(){

    const now = new Date();

    document.getElementById(
        "todayDate"
    ).innerText =
        now.toLocaleDateString(
            "ar-IQ",
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

}

function apiRequest(data){

    return fetch(
        API,
        {
            method:"POST",
            body:JSON.stringify(data)
        }
    )
    .then(function(response){

        return response.json();

    });

}

async function loadData(){

    const loading =
        document.getElementById(
            "loading"
        );

    const wrapper =
        document.getElementById(
            "tableWrapper"
        );

    loading.style.display = "block";
    wrapper.style.display = "none";

    try{

        const selectedDate =
            document.getElementById(
                "selectedDate"
            ).value || getToday();

        const employeesData =
            await apiRequest({
                action:"getEmployees"
            });

        if(
            employeesData.status !==
            "success"
        ){

            throw new Error(
                employeesData.message ||
                "تعذر جلب الموظفين"
            );

        }

        employees =
            employeesData.employees ||
            [];

        const attendanceData =
            await apiRequest({

                action:"getAttendance",

                date:selectedDate

            });

        if(
            attendanceData.status !==
            "success"
        ){

            throw new Error(
                attendanceData.message ||
                "تعذر جلب الحضور"
            );

        }

        attendance =
            attendanceData.attendance ||
            [];

        renderTable();

        loading.style.display = "none";
        wrapper.style.display = "block";

        updateStats();

    }
    catch(error){

        loading.innerHTML = `

            ❌ تعذر تحميل البيانات

            <br><br>

            ${safe(error.message)}

            <br><br>

            <button
                class="refresh"
                onclick="loadData()"
            >
                🔄 إعادة المحاولة
            </button>

        `;

    }

}

function getEmployeeName(employee){

    return (
        employee["الاسم"] ||
        employee["اسم الموظف"] ||
        employee["Employee Name"] ||
        ""
    );

}

function getEmployeeId(employee){

    return (
        employee["Employee ID"] ||
        employee["الرقم الوظيفي"] ||
        employee["رقم الموظف"] ||
        ""
    );

}

function getDepartment(employee){

    return (
        employee["القسم"] ||
        employee["Department"] ||
        ""
    );

}

function getAttendanceName(record){

    return (
        record["الاسم"] ||
        record["اسم الموظف"] ||
        record["Employee Name"] ||
        ""
    );

}

function getAttendanceForEmployee(employee){

    const employeeName =
        getEmployeeName(employee);

    const employeeId =
        getEmployeeId(employee);

    return attendance.find(
        function(record){

            const recordId =
                record["Employee ID"] ||
                record["الرقم الوظيفي"] ||
                record["رقم الموظف"] ||
                "";

            if(
                employeeId &&
                recordId &&
                normalize(employeeId) ===
                normalize(recordId)
            ){

                return true;

            }

            return (
                normalize(
                    getAttendanceName(record)
                ) ===
                normalize(employeeName)
            );

        }
    );

}

function getRecordValue(record, names){

    for(
        let i = 0;
        i < names.length;
        i++
    ){

        const key = names[i];

        if(
            record &&
            record[key] !== undefined &&
            record[key] !== null &&
            record[key] !== ""
        ){

            return record[key];

        }

    }

    return "";

}

function renderTable(){

    const tbody =
        document.getElementById(
            "employeesTable"
        );

    tbody.innerHTML = "";

    if(!employees.length){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >
                    لا يوجد موظفين
                </td>

            </tr>

        `;

        return;

    }

    employees.forEach(
        function(employee,index){

            const record =
                getAttendanceForEmployee(
                    employee
                );

            const name =
                getEmployeeName(employee);

            const department =
                getDepartment(employee);

            const checkIn =
                getRecordValue(
                    record,
                    [
                        "وقت الدخول",
                        "دخول",
                        "Check In"
                    ]
                );

            const checkOut =
                getRecordValue(
                    record,
                    [
                        "وقت الخروج",
                        "خروج",
                        "Check Out"
                    ]
                );

            const workHours =
                getRecordValue(
                    record,
                    [
                        "ساعات العمل",
                        "Work Hours"
                    ]
                );

            const status =
                getRecordValue(
                    record,
                    [
                        "الحالة",
                        "Status"
                    ]
                );

            const row =
                document.createElement("tr");

            row.dataset.name =
                name;

            row.dataset.department =
                department;

            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>

                    <div class="employee-name">
                        ${safe(name)}
                    </div>

                </td>

                <td>

                    <div class="department">
                        ${safe(department) || "-"}
                    </div>

                </td>

                <td>
                    ${safe(checkIn) || "-"}
                </td>

                <td>
                    ${safe(checkOut) || "-"}
                </td>

                <td>
                    ${safe(workHours) || "-"}
                </td>

                <td>
                    ${statusHTML(status)}
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="btn btn-present"
                            onclick='openAttendanceModal(${JSON.stringify(name)},${JSON.stringify(department)},"حاضر")'
                        >
                            🟢 حضور
                        </button>

                        <button
                            class="btn btn-out"
                            onclick='openAttendanceModal(${JSON.stringify(name)},${JSON.stringify(department)},"حاضر","out")'
                        >
                            🕐 خروج
                        </button>

                        <button
                            class="btn btn-absent"
                            onclick='quickStatus(${JSON.stringify(name)},${JSON.stringify(department)},"غائب")'
                        >
                            🔴 غياب
                        </button>

                        <button
                            class="btn btn-late"
                            onclick='quickStatus(${JSON.stringify(name)},${JSON.stringify(department)},"متأخر")'
                        >
                            🟡 تأخير
                        </button>

                        <button
                            class="btn btn-leave"
                            onclick='quickStatus(${JSON.stringify(name)},${JSON.stringify(department)},"إجازة")'
                        >
                            🏖️ إجازة
                        </button>

                    </div>

                </td>

            `;

            tbody.appendChild(row);

        }
    );

}

function statusHTML(status){

    status =
        String(status || "").trim();

    if(status === "حاضر"){

        return `
            <span class="status status-present">
                🟢 حاضر
            </span>
        `;

    }

    if(
        status === "غائب" ||
        status === "غياب"
    ){

        return `
            <span class="status status-absent">
                🔴 غائب
            </span>
        `;

    }

    if(status === "متأخر"){

        return `
            <span class="status status-late">
                🟡 متأخر
            </span>
        `;

    }

    if(status === "إجازة"){

        return `
            <span class="status status-leave">
                🏖️ إجازة
            </span>
        `;

    }

    return `
        <span class="status status-none">
            لم يسجل
        </span>
    `;

}

function updateStats(){

    let present = 0;
    let absent = 0;
    let late = 0;
    let leave = 0;

    attendance.forEach(
        function(record){

            const status =
                String(
                    record["الحالة"] ||
                    record["Status"] ||
                    ""
                ).trim();

            if(status === "حاضر"){
                present++;
            }

            if(
                status === "غائب" ||
                status === "غياب"
            ){
                absent++;
            }

            if(status === "متأخر"){
                late++;
            }

            if(status === "إجازة"){
                leave++;
            }

        }
    );

    document.getElementById(
        "totalCount"
    ).innerText =
        employees.length;

    document.getElementById(
        "presentCount"
    ).innerText =
        present;

    document.getElementById(
        "absentCount"
    ).innerText =
        absent;

    document.getElementById(
        "lateCount"
    ).innerText =
        late;

    document.getElementById(
        "leaveCount"
    ).innerText =
        leave;

}

function openAttendanceModal(
    name,
    department,
    status,
    mode
){

    editingRow = null;

    const today =
        document.getElementById(
            "selectedDate"
        ).value || getToday();

    document.getElementById(
        "modalEmployeeName"
    ).value = name;

    document.getElementById(
        "modalDepartment"
    ).value = department;

    document.getElementById(
        "modalDate"
    ).value = today;

    document.getElementById(
        "modalStatus"
    ).value =
        status || "حاضر";

    document.getElementById(
        "modalNotes"
    ).value = "";

    const existing =
        attendance.find(
            function(record){

                return normalize(
                    getAttendanceName(record)
                ) === normalize(name);

            }
        );

    if(existing){

        document.getElementById(
            "modalCheckIn"
        ).value =
            convertToTimeInput(
                getRecordValue(
                    existing,
                    [
                        "وقت الدخول",
                        "دخول",
                        "Check In"
                    ]
                )
            );

        document.getElementById(
            "modalCheckOut"
        ).value =
            convertToTimeInput(
                getRecordValue(
                    existing,
                    [
                        "وقت الخروج",
                        "خروج",
                        "Check Out"
                    ]
                )
            );

        document.getElementById(
            "modalStatus"
        ).value =
            getRecordValue(
                existing,
                [
                    "الحالة",
                    "Status"
                ]
            ) || status;

        document.getElementById(
            "modalNotes"
        ).value =
            getRecordValue(
                existing,
                [
                    "ملاحظات",
                    "Notes"
                ]
            );

        editingRow =
            existing.__row || null;

    }
    else{

        if(mode === "out"){

            document.getElementById(
                "modalCheckOut"
            ).value =
                currentTime();

        }
        else{

            document.getElementById(
                "modalCheckIn"
            ).value =
                currentTime();

        }

    }

    document.getElementById(
        "attendanceModal"
    ).style.display =
        "flex";

}

function closeModal(){

    document.getElementById(
        "attendanceModal"
    ).style.display =
        "none";

}

async function saveAttendance(){

    const name =
        document.getElementById(
            "modalEmployeeName"
        ).value;

    const department =
        document.getElementById(
            "modalDepartment"
        ).value;

    const date =
        document.getElementById(
            "modalDate"
        ).value;

    const checkIn =
        document.getElementById(
            "modalCheckIn"
        ).value;

    const checkOut =
        document.getElementById(
            "modalCheckOut"
        ).value;

    const status =
        document.getElementById(
            "modalStatus"
        ).value;

    const notes =
        document.getElementById(
            "modalNotes"
        ).value;

    if(!name){

        showMessage(
            "❌ اسم الموظف غير موجود",
            "error"
        );

        return;

    }

    try{

        let result;

        const existing =
            attendance.find(
                function(record){

                    return normalize(
                        getAttendanceName(record)
                    ) === normalize(name);

                }
            );

        if(
            existing &&
            existing.__row
        ){

            result =
                await apiRequest({

                    action:"updateAttendance",

                    row:existing.__row,

                    date:date,

                    employeeName:name,

                    department:department,

                    checkIn:checkIn,

                    checkOut:checkOut,

                    workHours:
                        calculateWorkHours(
                            checkIn,
                            checkOut
                        ),

                    status:status,

                    notes:notes

                });

        }
        else{

            result =
                await apiRequest({

                    action:"addAttendance",

                    date:date,

                    employeeName:name,

                    department:department,

                    checkIn:checkIn,

                    checkOut:checkOut,

                    workHours:
                        calculateWorkHours(
                            checkIn,
                            checkOut
                        ),

                    status:status,

                    notes:notes

                });

        }

        if(
            result.status !==
            "success"
        ){

            throw new Error(
                result.message ||
                "تعذر حفظ سجل الحضور"
            );

        }

        closeModal();

        showMessage(
            "✅ تم حفظ سجل الحضور بنجاح",
            "success"
        );

        await loadData();

    }
    catch(error){

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }

}

function currentTime(){

    const now = new Date();

    return (
        String(
            now.getHours()
        ).padStart(2,"0") +
        ":" +
        String(
            now.getMinutes()
        ).padStart(2,"0")
    );

}

function convertToTimeInput(value){

    if(!value){
        return "";
    }

    const text =
        String(value).trim();

    const match =
        text.match(
            /(\d{1,2}):(\d{2})/
        );

    if(!match){
        return "";
    }

    return (
        String(
            parseInt(
                match[1],
                10
            )
        ).padStart(2,"0") +
        ":" +
        match[2]
    );

}

function calculateWorkHours(
    start,
    end
){

    if(
        !start ||
        !end
    ){

        return "";

    }

    const startParts =
        start.split(":");

    const endParts =
        end.split(":");

    const startMinutes =
        Number(startParts[0]) * 60 +
        Number(startParts[1]);

    const endMinutes =
        Number(endParts[0]) * 60 +
        Number(endParts[1]);

    let difference =
        endMinutes -
        startMinutes;

    if(difference < 0){

        difference += 24 * 60;

    }

    const hours =
        Math.floor(
            difference / 60
        );

    const minutes =
        difference % 60;

    return (
        hours +
        ":" +
        String(minutes).padStart(2,"0")
    );

}

function filterEmployees(){

    const search =

        );

                    : "none";

    );

}

let messageTimer;

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );

    message.innerText =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            function(){

                message.style.display =
                    "none";

            },
            3500
        );

}

function normalize(value){

    return String(
        value === null ||
        value === undefined
            ? ""
            : value
    )
    .trim()
    .replace(
        /\s+/g,
        " "
    );

}

function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
