<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الحضور والغياب - Shassiha HR</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f9;
    font-family:'Cairo',sans-serif;
    color:#222;
}

.header{
    background:#ff7a00;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1300px;
    margin:25px auto;
    padding:0 15px;
}

.date-bar{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.date-title{
    font-size:18px;
    font-weight:bold;
}

.today{
    color:#ff7a00;
    margin-right:8px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    text-align:center;
}

.stat-icon{
    font-size:30px;
}

.stat-title{
    color:#777;
    margin-top:5px;
    font-size:13px;
}

.stat-number{
    font-size:27px;
    font-weight:bold;
    margin-top:5px;
}

.total{color:#333;}
.present{color:#16833b;}
.absent{color:#c62828;}
.late{color:#a56a00;}
.leave{color:#2878d0;}

.toolbar{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.search{
    flex:1;
    min-width:220px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:11px 14px;
    font-family:inherit;
    outline:none;
}

.search:focus{
    border-color:#ff7a00;
}

.refresh{
    border:none;
    background:#333;
    color:white;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
}

.table-card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

thead{
    background:#fff3e9;
}

th{
    padding:14px;
    text-align:center;
    font-size:13px;
    color:#555;
    white-space:nowrap;
}

td{
    padding:13px;
    border-top:1px solid #eee;
    text-align:center;
    font-size:13px;
}

tr:hover td{
    background:#fafafa;
}

.employee-name{
    font-weight:bold;
}

.department{
    color:#777;
    font-size:12px;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.status-present{
    background:#e7f7ed;
    color:#16833b;
}

.status-absent{
    background:#ffe5e5;
    color:#c62828;
}

.status-late{
    background:#fff4dc;
    color:#a56a00;
}

.status-leave{
    background:#e6f0ff;
    color:#2878d0;
}

.status-none{
    background:#f1f1f1;
    color:#777;
}

.actions{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-size:11px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-present{
    background:#16833b;
    color:white;
}

.btn-out{
    background:#2878d0;
    color:white;
}

.btn-absent{
    background:#c62828;
    color:white;
}

.btn-late{
    background:#d18b00;
    color:white;
}

.btn-leave{
    background:#555;
    color:white;
}

.empty,
.loading{
    padding:50px;
    text-align:center;
    color:#777;
}

.message{
    position:fixed;
    bottom:20px;
    left:20px;
    right:20px;
    max-width:500px;
    margin:auto;
    padding:14px 18px;
    border-radius:12px;
    color:white;
    text-align:center;
    font-size:14px;
    display:none;
    z-index:9999;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.message.success{
    background:#16833b;
}

.message.error{
    background:#c62828;
}

@media(max-width:700px){

    .header{
        padding:15px;
    }

    .header h1{
        font-size:18px;
    }

    .date-bar{
        flex-direction:column;
        align-items:flex-start;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        padding:15px;
    }

    .stat-number{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="header">

    <h1>🕐 الحضور والغياب</h1>

    <a href="index.html">
        ← الرئيسية
    </a>

</div>

<div class="container">

    <div class="date-bar">

        <div class="date-title">
            📅 حضور اليوم
            <span class="today" id="todayDate"></span>
        </div>

        <div>
            نظام الموارد البشرية HR
        </div>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-icon">👥</div>
            <div class="stat-title">إجمالي الموظفين</div>
            <div class="stat-number total" id="totalCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🟢</div>
            <div class="stat-title">حاضر</div>
            <div class="stat-number present" id="presentCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🔴</div>
            <div class="stat-title">غياب</div>
            <div class="stat-number absent" id="absentCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🟡</div>
            <div class="stat-title">متأخر</div>
            <div class="stat-number late" id="lateCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🏖️</div>
            <div class="stat-title">إجازة</div>
            <div class="stat-number leave" id="leaveCount">0</div>
        </div>

    </div>


    <div class="toolbar">

        <input
            type="text"
            id="search"
            class="search"
            placeholder="🔎 ابحث عن اسم الموظف أو القسم..."
            oninput="filterEmployees()"
        >

        <button
            class="refresh"
            onclick="loadData()"
        >
            🔄 تحديث
        </button>

    </div>


    <div class="table-card">

        <div
            class="loading"
            id="loading"
        >
            جاري تحميل الموظفين...
        </div>

        <div
            class="table-wrapper"
            id="tableWrapper"
            style="display:none;"
        >

            <table>

                <thead>

                    <tr>

                        <th>#</th>
                        <th>الموظف</th>
                        <th>القسم</th>
                        <th>وقت الدخول</th>
                        <th>وقت الخروج</th>
                        <th>ساعات العمل</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>

                    </tr>

                </thead>

                <tbody id="employeesTable"></tbody>

            </table>

        </div>

    </div>

</div>


<div
    id="message"
    class="message"
></div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";


let employees = [];
let attendance = [];


function getToday(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
        .padStart(2,"0");

    const day =
        String(now.getDate())
        .padStart(2,"0");

    return `${year}-${month}-${day}`;
}


function displayDate(){

    const now = new Date();

    document.getElementById("todayDate")
        .innerText =
        now.toLocaleDateString(
            "ar-IQ",
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );
}


async function apiRequest(data){

    const response =
        await fetch(
            API,
            {
                method:"POST",
                body:JSON.stringify(data)
            }
        );

    const result =
        await response.json();

    return result;
}


async function loadData(){

    const loading =
        document.getElementById("loading");

    const wrapper =
        document.getElementById("tableWrapper");

    loading.style.display = "block";
    wrapper.style.display = "none";

    try{

        const employeesData =
            await apiRequest({
                action:"getEmployees"
            });

        if(
            employeesData.status !== "success"
        ){

            throw new Error(
                employeesData.message ||
                "تعذر تحميل الموظفين"
            );

        }

        employees =
            employeesData.employees || [];


        const attendanceData =
            await apiRequest({

                action:"getAttendance",

                date:getToday()

            });


        if(
            attendanceData.status !== "success"
        ){

            throw new Error(
                attendanceData.message ||
                "تعذر تحميل الحضور"
            );

        }


        attendance =
            attendanceData.attendance || [];


        renderTable();

        loading.style.display = "none";
        wrapper.style.display = "block";


    }catch(error){

        loading.innerHTML = `
            ❌ تعذر تحميل البيانات
            <br><br>
            ${safe(error.message)}
            <br><br>
            <button
                class="refresh"
                onclick="loadData()"
            >
                🔄 إعادة المحاولة
            </button>
        `;

    }

}


function getEmployeeName(employee){

    return (
        employee["الاسم"] ||
        employee["اسم الموظف"] ||
        employee["Employee Name"] ||
        ""
    );
}


function getEmployeeDepartment(employee){

    return (
        employee["القسم"] ||
        employee["Department"] ||
        ""
    );
}


function getAttendanceName(record){

    return (
        record["الاسم"] ||
        record["اسم الموظف"] ||
        record["Employee Name"] ||
        ""
    );
}


function getAttendanceForEmployee(employee){

    const employeeName =
        getEmployeeName(employee);

    const employeeId =
        employee["Employee ID"] ||
        employee["الرقم الوظيفي"] ||
        employee["رقم الموظف"] ||
        "";


    // أولاً نحاول الرقم الوظيفي
    if(employeeId){

        const byId =
            attendance.find(record => {

                const recordId =
                    record["Employee ID"] ||
                    record["الرقم الوظيفي"] ||
                    record["رقم الموظف"] ||
                    "";

                return normalize(recordId) ===
                       normalize(employeeId);

            });

        if(byId){
            return byId;
        }

    }


    // بعدها الاسم
    return attendance.find(record => {

        return normalize(
            getAttendanceName(record)
        ) ===
        normalize(employeeName);

    });

}


function getRecordValue(record,names){

    for(const name of names){

        if(
            record &&
            record[name] !== undefined &&
            record[name] !== null &&
            record[name] !== ""
        ){

            return record[name];

        }

    }

    return "";

}


function renderTable(){

    const tbody =
        document.getElementById(
            "employeesTable"
        );

    tbody.innerHTML = "";


    if(!employees.length){

        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    لا يوجد موظفين
                </td>
            </tr>
        `;

        updateStats();

        return;
    }


    employees.forEach(
        (employee,index) => {

            const record =
                getAttendanceForEmployee(
                    employee
                );


            const name =
                getEmployeeName(employee);

            const department =
                getEmployeeDepartment(employee);


            const checkIn =
                getRecordValue(
                    record,
                    [
                        "وقت الدخول",
                        "دخول",
                        "Check In"
                    ]
                );


            const checkOut =
                getRecordValue(
                    record,
                    [
                        "وقت الخروج",
                        "خروج",
                        "Check Out"
                    ]
                );


            const hours =
                getRecordValue(
                    record,
                    [
                        "ساعات العمل",
                        "Work Hours"
                    ]
                );


            const status =
                getRecordValue(
                    record,
                    [
                        "الحالة",
                        "Status"
                    ]
                );


            const row =
                document.createElement("tr");


            row.dataset.name =
                name;

            row.dataset.department =
                department;


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    <div class="employee-name">
                        ${safe(name)}
                    </div>
                </td>

                <td>
                    <div class="department">
                        ${safe(department) || "-"}
                    </div>
                </td>

                <td>
                    ${formatTime(checkIn) || "-"}
                </td>

                <td>
                    ${formatTime(checkOut) || "-"}
                </td>

                <td>
                    ${safe(hours) || "-"}
                </td>

                <td>
                    ${statusHTML(status)}
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="btn btn-present"
                            onclick='markPresent(
                                ${JSON.stringify(name)},
                                ${JSON.stringify(department)}
                            )'
                        >
                            🟢 حضور
                        </button>


                        <button
                            class="btn btn-out"
                            onclick='markCheckout(
                                ${JSON.stringify(name)},
                                ${JSON.stringify(department)},
                                ${JSON.stringify(checkIn)},
                                ${JSON.stringify(status)}
                            )'
                        >
                            🕐 خروج
                        </button>


                        <button
                            class="btn btn-absent"
                            onclick='markStatus(
                                ${JSON.stringify(name)},
                                ${JSON.stringify(department)},
                                "غياب"
                            )'
                        >
                            🔴 غياب
                        </button>


                        <button
                            class="btn btn-late"
                            onclick='markStatus(
                                ${JSON.stringify(name)},
                                ${JSON.stringify(department)},
                                "متأخر"
                            )'
                        >
                            🟡 تأخير
                        </button>


                        <button
                            class="btn btn-leave"
                            onclick='markStatus(
                                ${JSON.stringify(name)},
                                ${JSON.stringify(department)},
                                "إجازة"
                            )'
                        >
                            🏖️ إجازة
                        </button>

                    </div>

                </td>

            `;


            tbody.appendChild(row);

        }
    );


    updateStats();

}


function statusHTML(status){

    const value =
        normalize(status);


    if(value === "حاضر"){

        return `
            <span class="status status-present">
                🟢 حاضر
            </span>
        `;

    }


    if(
        value === "غياب" ||
        value === "غائب"
    ){

        return `
            <span class="status status-absent">
                🔴 غياب
            </span>
        `;

    }


    if(value === "متأخر"){

        return `
            <span class="status status-late">
                🟡 متأخر
            </span>
        `;

    }


    if(value === "إجازة"){

        return `
            <span class="status status-leave">
                🏖️ إجازة
            </span>
        `;

    }


    return `
        <span class="status status-none">
            لم يسجل
        </span>
    `;

}


function updateStats(){

    let present = 0;
    let absent = 0;
    let late = 0;
    let leave = 0;


    // الإحصائيات تعتمد على سجلات اليوم فقط
    attendance.forEach(record => {

        const status =
            normalize(
                getRecordValue(
                    record,
                    ["الحالة","Status"]
                )
            );


        if(status === "حاضر"){
            present++;
        }

        else if(
            status === "غياب" ||
            status === "غائب"
        ){
            absent++;
        }

        else if(status === "متأخر"){
            late++;
        }

        else if(status === "إجازة"){
            leave++;
        }

    });


    document.getElementById(
        "totalCount"
    ).innerText =
        employees.length;


    document.getElementById(
        "presentCount"
    ).innerText =
        present;


    document.getElementById(
        "absentCount"
    ).innerText =
        absent;


    document.getElementById(
        "lateCount"
    ).innerText =
        late;


    document.getElementById(
        "leaveCount"
    ).innerText =
        leave;

}


async function markPresent(
    name,
    department
){

    if(!confirm(
        `تسجيل حضور الموظف:\n\n${name}\n\nهل أنت متأكد؟`
    )){

        return;

    }


    try{

        const record =
            getAttendanceByName(name);


        const now =
            getCurrentTime();


        let result;


        if(record){

            // تحديث السجل الموجود

            result =
                await apiRequest({

                    action:"updateAttendance",

                    row:record.__row,

                    date:getToday(),

                    employeeName:name,

                    department:department,

                    checkIn:
                        record.checkIn ||
                        now,

                    checkOut:
                        record.checkOut || "",

                    workHours:
                        record.workHours || "",

                    status:"حاضر",

                    notes:
                        record.notes || ""

                });

        }
        else{

            // إنشاء سجل جديد

            result =
                await apiRequest({

                    action:"addAttendance",

                    date:getToday(),

                    employeeName:name,

                    department:department,

                    checkIn:now,

                    checkOut:"",

                    workHours:"",

                    status:"حاضر",

                    notes:""

                });

        }


        if(result.status !== "success"){

            throw new Error(
                result.message ||
                "تعذر تسجيل الحضور"
            );

        }


        showMessage(
            "✅ تم تسجيل الحضور بنجاح",
            "success"
        );


        await loadData();


    }catch(error){

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }

}


async function markStatus(
    name,
    department,
    status
){

    if(!confirm(
        `الموظف:\n${name}\n\nالحالة: ${status}\n\nهل أنت متأكد؟`
    )){

        return;

    }


    try{

        const record =
            getAttendanceByName(name);


        let result;


        if(record){

            result =
                await apiRequest({

                    action:"updateAttendance",

                    row:record.__row,

                    date:getToday(),

                    employeeName:name,

                    department:department,

                    checkIn:
                        record.checkIn || "",

                    checkOut:
                        record.checkOut || "",

                    workHours:
                        record.workHours || "",

                    status:status,

                    notes:
                        record.notes || ""

                });

        }
        else{

            result =
                await apiRequest({

                    action:"addAttendance",

                    date:getToday(),

                    employeeName:name,

                    department:department,

                    checkIn:"",

                    checkOut:"",

                    workHours:"",

                    status:status,

                    notes:""

                });

        }


        if(result.status !== "success"){

            throw new Error(
                result.message ||
                "تعذر تحديث الحالة"
            );

        }


        showMessage(
            `✅ تم تسجيل ${status} بنجاح`,
            "success"
        );


        await loadData();


    }catch(error){

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }

}


async function markCheckout(
    name,
    department,
    existingCheckIn,
    existingStatus
){

    if(!confirm(
        `تسجيل خروج الموظف:\n\n${name}\n\nهل أنت متأكد؟`
    )){

        return;

    }


    try{

        const record =
            getAttendanceByName(name);


        if(!record){

            throw new Error(
                "لا يوجد سجل حضور لهذا الموظف اليوم"
            );

        }


        const checkIn =
            record.checkIn ||
            existingCheckIn;


        if(!checkIn){

            throw new Error(
                "لا يوجد وقت دخول مسجل للموظف"
            );

        }


        const checkOut =
            getCurrentTime();


        const workHours =
            calculateWorkHours(
                checkIn,
                checkOut
            );


        const result =
            await apiRequest({

                action:"updateAttendance",

                row:record.__row,

                date:getToday(),

                employeeName:name,

                department:department,

                checkIn:checkIn,

                checkOut:checkOut,

                workHours:workHours,

                status:
                    existingStatus ||
                    record.status ||
                    "حاضر",

                notes:
                    record.notes || ""

            });


        if(result.status !== "success"){

            throw new Error(
                result.message ||
                "تعذر تسجيل الخروج"
            );

        }


        showMessage(
            `✅ تم تسجيل الخروج\nساعات العمل: ${workHours}`,
            "success"
        );


        await loadData();


    }catch(error){

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }

}


function getAttendanceByName(name){

    const index =
        attendance.findIndex(record => {

            return normalize(
                getAttendanceName(record)
            ) ===
            normalize(name);

        });


    if(index === -1){

        return null;

    }


    const record =
        attendance[index];


    return {

        __row:
            record.__row,

        checkIn:
            getRecordValue(
                record,
                [
                    "وقت الدخول",
                    "دخول",
                    "Check In"
                ]
            ),

        checkOut:
            getRecordValue(
                record,
                [
                    "وقت الخروج",
                    "خروج",

function getCurrentTime(){

    const now =
        new Date();


    return now.toLocaleTimeString(
        "en-US",
        {
            hour:"numeric",
            minute:"2-digit",
            hour12:true
        }
    );

}


function parseTime(value){

    if(!value){

        return null;

    }


    const text =
        String(value)
            .trim()
            .toLowerCase();


    let match =
        text.match(
            /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?$/
        );


    if(!match){

        return null;

    }


    let hour =
        parseInt(match[1],10);

    const minute =
        parseInt(match[2],10);


    if(match[4]){

        const period =
            match[4];

        if(
            period === "pm" &&
            hour < 12
        ){

            hour += 12;

        }

        if(
            period === "am" &&
            hour === 12
        ){

            hour = 0;

        }

    }


    return (
        hour * 60 +
        minute
    );

}


function calculateWorkHours(
    checkIn,
    checkOut
){

    const start =
        parseTime(checkIn);

    const end =
        parseTime(checkOut);


    if(
        start === null ||
        end === null
    ){

        return "";

    }


    let difference =
        end - start;


    if(difference < 0){

        difference += 24 * 60;

    }


    const hours =
        Math.floor(
            difference / 60
        );

    const minutes =
        difference % 60;


    return (
        hours +
        ":" +
        String(minutes)
            .padStart(2,"0")
    );

}


function formatTime(value){

    if(!value){

        return "";

    }


    const text =
        String(value)
            .trim();


    if(
        text.includes("GMT") ||
        text.includes("2026") ||
        text.includes("2025")
    ){

        const date =
            new Date(value);

        if(!isNaN(date.getTime())){

            return date.toLocaleTimeString(
                "ar-IQ",
                {
                    hour:"numeric",
                    minute:"2-digit"
                }
            );

        }

    }


    return text;

}

function normalize(value){

    return String(
        value === null ||
        value === undefined
            ? ""
            : value
    )
    .trim()
    .replace(/\s+/g," ");

}


function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}
