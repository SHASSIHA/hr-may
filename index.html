<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>نظام الموارد البشرية HR</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
rel="stylesheet">


<style>

/* =========================
   GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}


/* =========================
   HEADER
========================= */

.header{

    background:#ff7a00;

    color:white;

    padding:20px;

    text-align:center;

    font-size:24px;

    font-weight:bold;

    box-shadow:
        0 3px 10px rgba(0,0,0,.12);

}


/* =========================
   CONTAINER
========================= */

.container{

    padding:25px;

    max-width:1200px;

    margin:auto;

}


/* =========================
   CARDS
========================= */

.cards{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );

    gap:18px;

}


/* =========================
   CARD
========================= */

.card{

    background:white;

    padding:28px 20px;

    border-radius:16px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.08);

    text-align:center;

    cursor:pointer;

    transition:.25s;

    text-decoration:none;

    color:#222;

    display:block;

}


.card:hover{

    transform:translateY(-5px);

    box-shadow:
        0 6px 18px rgba(0,0,0,.12);

}


/* =========================
   ICON
========================= */

.icon{

    font-size:42px;

    margin-bottom:10px;

}


/* =========================
   TITLE
========================= */

.title{

    font-size:18px;

    font-weight:bold;

}


/* =========================
   COUNT
========================= */

.count{

    font-size:28px;

    color:#ff7a00;

    margin-top:8px;

    font-weight:bold;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{

        font-size:20px;

        padding:17px;

    }


    .container{

        padding:15px;

    }


    .cards{

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    نظام الموارد البشرية HR

</div>



<!-- =========================
     MAIN
========================= -->

<div class="container">

<div class="cards">


<!-- =========================
     EMPLOYEES
========================= -->

<a
    class="card"
    href="./employees.html">

    <div class="icon">
        👥
    </div>

    <div class="title">
        ادارة الموظفين
    </div>

    <div
        class="count"
        id="employeesCount">

        0

    </div>

</a>



<!-- =========================
     ADD EMPLOYEE
========================= -->

<a class="card" href="./add-employee.html">

    <div class="icon">➕</div>

    <div class="title">
        إضافة موظف
    </div>

</a>


<!-- =========================
     ATTENDANCE
========================= -->

<a
    class="card"
    href="./attendance.html">

    <div class="icon">
        🕐
    </div>

    <div class="title">
        الحضور والغياب
    </div>

</a>



<!-- =========================
     TRANSACTIONS
========================= -->

<a class="card" href="transactions.html">

    <div class="icon">
        📄
    </div>

    <div class="title">
        المعاملات
    </div>

</a>


<!-- =========================
     REPORTS
========================= -->

<div
    class="card"
    onclick="comingSoon('التقارير')">

    <div class="icon">
        📊
    </div>

    <div class="title">
        التقارير
    </div>

</div>



<!-- =========================
     SETTINGS
========================= -->

<div
    class="card"
    onclick="comingSoon('الإعدادات')">

    <div class="icon">
        ⚙️
    </div>

    <div class="title">
        الإعدادات
    </div>

</div>


</div>

</div>



<script>


// =====================================================
// API
// =====================================================

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";



// =====================================================
// LOAD EMPLOYEES COUNT
// =====================================================

async function loadEmployees(){

    try{

        const response =
            await fetch(

                API,

                {

                    method:"POST",

                    body:
                        JSON.stringify({

                            action:
                                "getEmployees"

                        })

                }

            );


        const data =
            await response.json();


        if(
            data.status ===
            "success"
        ){

            document.getElementById(
                "employeesCount"
            ).innerText =
                data.employees.length;

        }


    }

    catch(error){

        console.log(
            "Employees API Error:",
            error
        );

    }

}



// =====================================================
// COMING SOON
// =====================================================

function comingSoon(name){

    alert(

        "قسم " +
        name +
        " راح يتم تفعيله بالمرحلة القادمة 🔥"

    );

}



// =====================================================
// START
// =====================================================

loadEmployees();


</script>


</body>

</html>
