<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>إضافة موظف - Shassiha HR</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

/* HEADER */

.header{
    background:#ff7a00;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

/* CONTAINER */

.container{
    max-width:1000px;
    margin:25px auto;
    padding:0 15px;
}

/* CARD */

.form-card{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

/* TITLE */

.form-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
    padding-bottom:12px;
    border-bottom:1px solid #eee;
}

/* GRID */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

/* FIELD */

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1 / -1;
}

.field label{
    font-size:13px;
    color:#666;
    margin-bottom:6px;
    font-weight:600;
}

.field input,
.field select,
.field textarea{

    width:100%;

    padding:12px 13px;

    border:1px solid #ddd;

    border-radius:10px;

    font-family:inherit;

    font-size:14px;

    outline:none;

    background:#fff;

}

.field input:focus,
.field select:focus,
.field textarea:focus{

    border-color:#ff7a00;

    box-shadow:
        0 0 0 2px rgba(255,122,0,.10);

}

.field textarea{

    min-height:100px;

    resize:vertical;

}

/* EMPLOYEE ID */

.employee-id{

    background:#fff4ea;

    border:1px solid #ffd4b5;

    color:#ff7a00;

    padding:13px;

    border-radius:10px;

    font-weight:bold;

}

/* BUTTONS */

.actions{

    display:flex;

    gap:10px;

    margin-top:25px;

    flex-wrap:wrap;

}

.btn{

    border:none;

    border-radius:10px;

    padding:12px 22px;

    font-family:inherit;

    font-size:14px;

    cursor:pointer;

}

.save{

    background:#ff7a00;

    color:white;

}

.cancel{

    background:#333;

    color:white;

}

.btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}

/* MESSAGE */

.message{

    display:none;

    margin-bottom:20px;

    padding:13px;

    border-radius:10px;

    text-align:center;

    font-weight:600;

}

.success{

    display:block;

    background:#e7f7ed;

    color:#16833b;

}

.error{

    display:block;

    background:#ffe5e5;

    color:#c62828;

}

/* MOBILE */

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .header{
        flex-direction:column;
        gap:8px;
        text-align:center;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>
        ➕ إضافة موظف
    </h1>

    <a href="employees.html">
        ← العودة للموظفين
    </a>

</div>



<div class="container">


    <div
        id="message"
        class="message">
    </div>


    <div class="form-card">


        <div class="form-title">

            👤 بيانات الموظف الجديد

        </div>


        <form id="employeeForm">


            <div class="form-grid">


                <!-- رقم الموظف -->

                <div class="field">

                    <label>
                        رقم الموظف
                    </label>

                    <div class="employee-id">
                        يتم توليده تلقائياً
                    </div>

                </div>


                <!-- الاسم -->

                <div class="field">

                    <label>
                        الاسم الكامل *
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                        placeholder="اكتب اسم الموظف">

                </div>


                <!-- الهاتف -->

                <div class="field">

                    <label>
                        رقم الهاتف *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        required
                        placeholder="07xxxxxxxxx">

                </div>


                <!-- العنوان -->

                <div class="field">

                    <label>
                        العنوان
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="عنوان الموظف">

                </div>


                <!-- القسم -->

                <div class="field">

                    <label>
                        القسم
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="مثلاً: الإدارة">

                </div>


                <!-- الوظيفة -->

                <div class="field">

                    <label>
                        الوظيفة
                    </label>

                    <input
                        type="text"
                        id="position"
                        placeholder="مثلاً: محاسب">

                </div>


                <!-- تاريخ التعيين -->

                <div class="field">

                    <label>
                        تاريخ التعيين
                    </label>

                    <input
                        type="date"
                        id="hireDate">

                </div>


                <!-- الراتب -->

                <div class="field">

                    <label>
                        الراتب
                    </label>

                    <input
                        type="number"
                        id="salary"
                        min="0"
                        placeholder="مثلاً: 750000">

                </div>


                <!-- الملاحظات -->

                <div class="field full">

                    <label>
                        ملاحظات
                    </label>

                    <textarea
                        id="notes"
                        placeholder="أي ملاحظات إضافية عن الموظف..."></textarea>

                </div>


            </div>


            <!-- BUTTONS -->

            <div class="actions">


                <button
                    type="submit"
                    class="btn save"
                    id="saveBtn">

                    💾 حفظ الموظف

                </button>


                <button
                    type="button"
                    class="btn cancel"
                    onclick="window.location.href='employees.html'">

                    إلغاء

                </button>


            </div>


        </form>


    </div>

</div>



<script>


// =====================================================
// API
// =====================================================

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";



// =====================================================
// FORM
// =====================================================

document
.getElementById("employeeForm")
.addEventListener(
    "submit",
    addEmployee
);



// =====================================================
// ADD EMPLOYEE
// =====================================================

async function addEmployee(event){

    event.preventDefault();


    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const address =
        document.getElementById(
            "address"
        ).value.trim();


    const department =
        document.getElementById(
            "department"
        ).value.trim();


    const position =
        document.getElementById(
            "position"
        ).value.trim();


    const hireDate =
        document.getElementById(
            "hireDate"
        ).value;


    const salary =
        document.getElementById(
            "salary"
        ).value;


    const notes =
        document.getElementById(
            "notes"
        ).value.trim();



    if(!name){

        showMessage(
            "❌ يرجى إدخال اسم الموظف",
            "error"
        );

        return;

    }


    if(!phone){

        showMessage(
            "❌ يرجى إدخال رقم الهاتف",
            "error"
        );

        return;

    }



    saveBtn.disabled = true;

    saveBtn.innerText =
        "⏳ جاري الحفظ...";



    try{


        const response =
            await fetch(

                API,

                {

                    method:"POST",

                    body:
                        JSON.stringify({

                            action:
                                "addEmployee",

                            name:
                                name,

                            phone:
                                phone,

                            address:
                                address,

                            department:
                                department,

                            position:
                                position,

                            hireDate:
                                hireDate,

                            salary:
                                salary,

                            notes:
                                notes

                        })

                }

            );


        const data =
            await response.json();



        if(
            data.status !==
            "success"
        ){

            throw new Error(
                data.message ||
                "فشل حفظ الموظف"
            );

        }



        showMessage(

            "✅ تمت إضافة الموظف بنجاح" +
            "<br>" +
            "رقم الموظف: " +
            data.employeeId,

            "success"

        );


        document
            .getElementById(
                "employeeForm"
            )
            .reset();



        saveBtn.disabled = false;

        saveBtn.innerText =
            "💾 حفظ الموظف";


    }

    catch(error){

        showMessage(

            "❌ حدث خطأ أثناء الحفظ" +
            "<br><br>" +
            safe(error.message),

            "error"

        );


        saveBtn.disabled = false;

        saveBtn.innerText =
            "💾 حفظ الموظف";

    }

}



// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        text;


    message.className =
        "message " + type;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



// =====================================================
// SAFE
// =====================================================

function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
