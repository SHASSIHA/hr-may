<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>كتاب مباشرة - Shassiha HR</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Cairo',sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

/* HEADER */

.header{
    background:#ff7a00;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

/* CONTAINER */

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

/* CARD */

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
    padding-bottom:12px;
    border-bottom:1px solid #eee;
}

/* FORM */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1 / -1;
}

label{
    font-size:13px;
    color:#666;
    margin-bottom:6px;
    font-weight:600;
}

input,
select,
textarea{

    width:100%;

    padding:12px;

    border:1px solid #ddd;

    border-radius:10px;

    font-family:inherit;

    font-size:14px;

    outline:none;

    background:white;
}

input:focus,
select:focus,
textarea:focus{

    border-color:#ff7a00;

}

textarea{
    min-height:100px;
    resize:vertical;
}

/* EMPLOYEE INFO */

.employee-info{

    display:none;

    background:#fff4ea;

    border:1px solid #ffd4b5;

    border-radius:12px;

    padding:15px;

    margin-top:15px;

}

.employee-info strong{
    color:#ff7a00;
}

/* BUTTONS */

.actions{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:25px;

}

.btn{

    border:none;

    border-radius:10px;

    padding:12px 22px;

    font-family:inherit;

    cursor:pointer;

    font-size:14px;

}

.save{

    background:#16833b;

    color:white;

}

.print{

    background:#2878d0;

    color:white;

    display:none;

}

.back{

    background:#333;

    color:white;

}

/* MESSAGE */

.message{

    display:none;

    padding:13px;

    border-radius:10px;

    margin-bottom:20px;

    text-align:center;

    font-weight:600;

}

.success{

    display:block;

    background:#e7f7ed;

    color:#16833b;

}

.error{

    display:block;

    background:#ffe5e5;

    color:#c62828;

}


/* PRINT AREA */

.print-area{

    display:none;

}


/* MOBILE */

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .header{
        flex-direction:column;
        gap:8px;
        text-align:center;
    }

    .btn{
        width:100%;
    }

}


/* PRINT */

@media print{

    body{
        background:white;
    }

    .header,
    .card,
    .container{
        display:none !important;
    }

    .print-area{
        display:block !important;
        padding:50px;
        font-family:'Cairo',sans-serif;
    }

    .print-header{
        text-align:center;
        margin-bottom:50px;
    }

    .print-header h1{
        font-size:26px;
        margin-bottom:10px;
    }

    .print-title{
        text-align:center;
        font-size:24px;
        font-weight:bold;
        margin-bottom:40px;
        text-decoration:underline;
    }

    .print-body{
        font-size:18px;
        line-height:2.2;
    }

    .print-footer{
        margin-top:80px;
        text-align:left;
        font-size:17px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>
        📄 كتاب مباشرة
    </h1>

    <a href="transactions.html">
        ← العودة للمعاملات
    </a>

</div>



<div class="container">


    <div
    id="message"
    class="message">
    </div>


    <div class="card">


        <div class="title">

            📄 إصدار كتاب مباشرة

        </div>


        <div class="grid">


            <!-- الموظف -->

            <div class="field full">

                <label>
                    الموظف *
                </label>

                <select
                    id="employee"
                    required>

                    <option value="">
                        جاري تحميل الموظفين...
                    </option>

                </select>

            </div>


            <!-- تاريخ المباشرة -->

            <div class="field">

                <label>
                    تاريخ المباشرة *
                </label>

                <input
                    type="date"
                    id="directDate"
                    required>

            </div>


            <!-- رقم الكتاب -->

            <div class="field">

                <label>
                    رقم الكتاب
                </label>

                <input
                    type="text"
                    id="bookNumber"
                    placeholder="مثلاً: 15">

            </div>


            <!-- الملاحظات -->

            <div class="field full">

                <label>
                    ملاحظات
                </label>

                <textarea
                    id="notes"
                    placeholder="ملاحظات إضافية..."></textarea>

            </div>


        </div>


        <!-- معلومات الموظف -->

        <div
        id="employeeInfo"
        class="employee-info">

        </div>


        <!-- ACTIONS -->

        <div class="actions">


            <button
            class="btn save"
            id="saveBtn"
            onclick="saveDirect()">

                💾 حفظ المباشرة

            </button>


            <button
            class="btn print"
            id="printBtn"
            onclick="printDirect()">

                🖨️ طباعة الكتاب

            </button>


            <button
            class="btn back"
            onclick="window.location.href='transactions.html'">

                ← رجوع

            </button>


        </div>


    </div>

</div>



<!-- PRINT AREA -->

<div
id="printArea"
class="print-area">

    <div class="print-header">

        <h1>
            اسم الشركة / المطعم
        </h1>

        <div>
            إدارة الموارد البشرية
        </div>

    </div>


    <div class="print-title">

        كتاب مباشرة

    </div>


    <div
    id="printBody"
    class="print-body">

    </div>


    <div class="print-footer">

        مسؤول الموارد البشرية

        <br><br>

        التوقيع: ______________

    </div>

</div>



<script>


// =====================================================
// API
// =====================================================

const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";


// =====================================================
// DATA
// =====================================================

let employees = [];

let selectedEmployee = null;

let savedTransaction = null;


// =====================================================
// LOAD EMPLOYEES
// =====================================================

async function loadEmployees(){

    const select =
        document.getElementById(
            "employee"
        );

    try{

        const response =
            await fetch(

                API,

                {

                    method:"POST",

                    body:JSON.stringify({

                        action:
                            "getEmployees"

                    })

                }

            );


        const data =
            await response.json();


        if(
            data.status !==
            "success"
        ){

            throw new Error(
                data.message ||
                "فشل تحميل الموظفين"
            );

        }


        employees =
            data.employees || [];


        select.innerHTML = `

            <option value="">
                اختر الموظف
            </option>

        `;


        employees.forEach(
            employee => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    employee["Employee ID"];


                option.textContent =
                    employee["الاسم"] +
                    " — " +
                    employee["Employee ID"];


                select.appendChild(
                    option
                );

            }
        );


    }

    catch(error){

        select.innerHTML = `

            <option value="">
                ❌ تعذر تحميل الموظفين
            </option>

        `;

        showMessage(
            error.message,
            "error"
        );

    }

}


// =====================================================
// SELECT EMPLOYEE
// =====================================================

document
.getElementById("employee")
.addEventListener(
    "change",
    function(){

        const id =
            this.value;


        selectedEmployee =
            employees.find(

                e =>
                String(
                    e["Employee ID"]
                ) === String(id)

            );


        const box =
            document.getElementById(
                "employeeInfo"
            );


        if(!selectedEmployee){

            box.style.display =
                "none";

            return;

        }


        box.style.display =
            "block";


        box.innerHTML = `

            <strong>
                ${safe(
                    selectedEmployee["الاسم"]
                )}
            </strong>

            <br>

            الوظيفة:
            ${safe(
                selectedEmployee["الوظيفة"]
            )}

            <br>

            القسم:
            ${safe(
                selectedEmployee["القسم"]
            )}

            <br>

            رقم الموظف:
            ${safe(
                selectedEmployee["Employee ID"]
            )}

        `;

    }
);


// =====================================================
// SAVE DIRECT
// =====================================================

async function saveDirect(){

    if(!selectedEmployee){

        showMessage(
            "❌ يرجى اختيار الموظف",
            "error"
        );

        return;

    }


    const directDate =
        document.getElementById(
            "directDate"
        ).value;


    if(!directDate){

        showMessage(
            "❌ يرجى اختيار تاريخ المباشرة",
            "error"
        );

        return;

    }


    const bookNumber =
        document.getElementById(
            "bookNumber"
        ).value.trim();


    const notes =
        document.getElementById(
            "notes"
        ).value.trim();


    const saveBtn =
        document.getElementById(
            "saveBtn"
        );


    saveBtn.disabled =
        true;


    saveBtn.innerText =
        "⏳ جاري الحفظ...";


    try{

        const response =
            await fetch(

                API,

                {

                    method:"POST",

                    body:JSON.stringify({

                        action:
                            "addTransaction",

                        employeeId:
                            selectedEmployee[
                                "Employee ID"
                            ],

                        employeeName:
                            selectedEmployee[
                                "الاسم"
                            ],

                        type:
                            "مباشرة",

                        date:
                            directDate,

                        bookNumber:
                            bookNumber,

                        notes:
                            notes

                    })

                }

            );


        const data =
            await response.json();


        if(
            data.status !==
            "success"
        ){

            throw new Error(
                data.message ||
                "فشل حفظ المعاملة"
            );

        }


        savedTransaction =
            data;


        showMessage(
            "✅ تم تسجيل كتاب المباشرة بنجاح",
            "success"
        );


        document
        .getElementById(
            "printBtn"
        )
        .style.display =
            "inline-block";


        createPrint();


    }

    catch(error){

        showMessage(
            "❌ " +
            error.message,
            "error"
        );

    }


    saveBtn.disabled =
        false;


    saveBtn.innerText =
        "💾 حفظ المباشرة";

}


// =====================================================
// CREATE PRINT
// =====================================================

function createPrint(){

    if(!selectedEmployee)
        return;


    const date =
        document.getElementById(
            "directDate"
        ).value;


    const formattedDate =
        formatDate(date);


    const bookNumber =
        document.getElementById(
            "bookNumber"
        ).value;


    const html = `

        تحية طيبة...

        <br><br>

        نود إعلامكم بأن الموظف
        <strong>
            ${safe(
                selectedEmployee["الاسم"]
            )}
        </strong>

        صاحب الرقم الوظيفي
        <strong>
            ${safe(
                selectedEmployee["Employee ID"]
            )}
        </strong>

        والذي يشغل وظيفة
        <strong>
            ${safe(
                selectedEmployee["الوظيفة"]
            )}
        </strong>

        في قسم
        <strong>
            ${safe(
                selectedEmployee["القسم"]
            )}
        </strong>

        قد باشر بالعمل لدينا اعتباراً من تاريخ
        <strong>
            ${safe(
                formattedDate
            )}
        </strong>.

        <br><br>

        ${bookNumber
            ? "رقم الكتاب: " +
              safe(bookNumber)
            : ""}

    `;


    document.getElementById(
        "printBody"
    ).innerHTML =
        html;

}


// =====================================================
// PRINT
// =====================================================

function printDirect(){

    createPrint();

    window.print();

}


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.innerHTML =
        safe(text);


    box.className =
        "message " +
        type;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


// =====================================================
// DATE
// =====================================================

function formatDate(value){

    if(!value)
        return "-";


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return value;

    }


    return date.toLocaleDateString(
        "en-GB"
    );

}


// =====================================================
// SAFE
// =====================================================

function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================================
// START
// =====================================================

loadEmployees();


// وضع تاريخ اليوم تلقائياً

document.getElementById(
    "directDate"
).value =
    new Date()
    .toISOString()
    .split("T")[0];

</script>


</body>

</html>
