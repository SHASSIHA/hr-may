<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الموظفين - Shassiha HR</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:#f5f6f8;
    color:#222;
}

.header{
    background:#ff6b00;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:15px;
}

.title h2{
    margin:0;
}

.title p{
    margin:5px 0 0;
    color:#777;
}

.btn{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-family:inherit;
    cursor:pointer;
    font-size:14px;
}

.btn-primary{
    background:#ff6b00;
    color:white;
}

.btn-secondary{
    background:#333;
    color:white;
}

.search-box{
    background:white;
    padding:15px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    font-family:inherit;
    font-size:14px;
}

.table-box{
    background:white;
    border-radius:15px;
    overflow:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

thead{
    background:#333;
    color:white;
}

th,
td{
    padding:13px 10px;
    text-align:center;
    border-bottom:1px solid #eee;
    white-space:nowrap;
}

tbody tr:hover{
    background:#fafafa;
}

.status{
    display:inline-block;
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
}

.active{
    background:#e7f7ed;
    color:#16833b;
}

.inactive{
    background:#ffe9e9;
    color:#c62828;
}

.leave{
    background:#fff4dc;
    color:#a56a00;
}

.actions{
    display:flex;
    justify-content:center;
    gap:5px;
}

.action{
    border:none;
    padding:7px 10px;
    border-radius:7px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
}

.view{
    background:#eee;
}

.edit{
    background:#fff0e5;
    color:#d95d00;
}

.end{
    background:#ffe5e5;
    color:#c62828;
}

.loading{
    padding:35px;
    text-align:center;
    color:#777;
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
}

.success{
    background:#e7f7ed;
    color:#16833b;
}

.error{
    background:#ffe9e9;
    color:#c62828;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    padding:20px;
    overflow:auto;
}

.modal-content{
    background:white;
    max-width:800px;
    margin:30px auto;
    border-radius:18px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    margin:0;
}

.close{
    border:none;
    background:#eee;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    margin-bottom:6px;
    font-size:13px;
    font-weight:600;
}

.field input,
.field select,
.field textarea{
    padding:11px;
    border:1px solid #ddd;
    border-radius:9px;
    font-family:inherit;
    font-size:14px;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.form-footer{
    margin-top:20px;
    display:flex;
    justify-content:flex-start;
    gap:10px;
}

@media(max-width:700px){

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

}

</style>

</head>


<body>


<div class="header">

    <h1>👥 إدارة الموظفين</h1>

    <a href="index.html">
        ← الرئيسية
    </a>

</div>


<div class="container">


    <div class="top">

        <div class="title">

            <h2>الموظفين</h2>

            <p>إدارة بيانات موظفي المطعم</p>

        </div>

        <button
            class="btn btn-primary"
            onclick="openAddEmployee()"
        >
            ➕ إضافة موظف
        </button>

    </div>


    <div id="message" class="message"></div>


    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔎 ابحث باسم الموظف أو رقم الموظف أو القسم..."
            oninput="searchEmployees()"
        >

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>رقم الموظف</th>
                    <th>الاسم</th>
                    <th>القسم</th>
                    <th>الوظيفة</th>
                    <th>الراتب</th>
                    <th>تاريخ التعيين</th>
                    <th>نوع العقد</th>
                    <th>الحالة</th>
                    <th>الإجراءات</th>

                </tr>

            </thead>


            <tbody id="employeesTable">

                <tr>

                    <td colspan="9">

                        <div class="loading">
                            جاري تحميل الموظفين...
                        </div>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>



<!-- إضافة موظف -->

<div class="modal" id="employeeModal">

    <div class="modal-content">


        <div class="modal-header">

            <h2>➕ إضافة موظف جديد</h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form id="employeeForm">


            <div class="form-grid">


                <div class="field full">

                    <label>اسم الموظف *</label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div class="field">

                    <label>القسم</label>

                    <input
                        type="text"
                        id="department"
                    >

                </div>


                <div class="field">

                    <label>الوظيفة</label>

                    <input
                        type="text"
                        id="position"
                    >

                </div>


                <div class="field">

                    <label>الراتب</label>

                    <input
                        type="number"
                        id="salary"
                    >

                </div>


                <div class="field">

                    <label>تاريخ التعيين</label>

                    <input
                        type="date"
                        id="hireDate"
                    >

                </div>


                <div class="field">

                    <label>نوع العقد</label>

                    <select id="contractType">

                        <option value="">
                            اختر نوع العقد
                        </option>

                        <option value="دائم">
                            دائم
                        </option>

                        <option value="مؤقت">
                            مؤقت
                        </option>

                        <option value="يومي">
                            يومي
                        </option>

                        <option value="تجربة">
                            فترة تجربة
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>الهاتف</label>

                    <input
                        type="tel"
                        id="phone"
                    >

                </div>


                <div class="field">

                    <label>العنوان</label>

                    <input
                        type="text"
                        id="address"
                    >

                </div>


                <div class="field">

                    <label>تاريخ الميلاد</label>

                    <input
                        type="date"
                        id="birthDate"
                    >

                </div>


                <div class="field">

                    <label>جهة اتصال للطوارئ</label>

                    <input
                        type="text"
                        id="emergencyContact"
                    >

                </div>


                <div class="field">

                    <label>رقم هاتف الطوارئ</label>

                    <input
                        type="tel"
                        id="emergencyPhone"
                    >

                </div>


                <div class="field">

                    <label>رقم البطاقة الوطنية</label>

                    <input
                        type="text"
                        id="nationalId"
                    >

                </div>


                <div class="field">

                    <label>تاريخ انتهاء العقد</label>

                    <input
                        type="date"
                        id="contractEndDate"
                    >

                </div>


                <div class="field full">

                    <label>ملاحظات</label>

                    <textarea id="notes"></textarea>

                </div>


            </div>


            <div class="form-footer">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    💾 حفظ الموظف
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="closeModal()"
                >
                    إلغاء
                </button>

            </div>


        </form>

    </div>

</div>



<script>


const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";


let employees = [];


// ======================================
// تحميل الموظفين
// ======================================

async function loadEmployees(){

    const table =
        document.getElementById("employeesTable");


    table.innerHTML = `

        <tr>

            <td colspan="9">

                <div class="loading">
                    جاري تحميل الموظفين...
                </div>

            </td>

        </tr>

    `;


    try{

        const response =
            await fetch(API,{

                method:"POST",

                body:JSON.stringify({

                    action:"getEmployees"

                })

            });


        const data =
            await response.json();


        if(data.status !== "success"){

            throw new Error(
                data.message ||
                "حدث خطأ"
            );

        }


        employees =
            data.employees || [];


        renderEmployees(employees);


    }catch(error){

        table.innerHTML = `

            <tr>

                <td colspan="9">

                    <div class="loading">

                        ❌ تعذر تحميل الموظفين

                        <br><br>

                        ${safe(error.message)}

                    </div>

                </td>

            </tr>

        `;

    }

}



// ======================================
// عرض الموظفين
// ======================================

function renderEmployees(list){

    const table =
        document.getElementById("employeesTable");


    if(!list.length){

        table.innerHTML = `

            <tr>

                <td colspan="9">

                    <div class="loading">
                        لا يوجد موظفين حالياً
                    </div>

                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML = list.map(employee => `

        <tr>

            <td>

                <strong>
                    ${safe(employee["Employee ID"])}
                </strong>

            </td>


            <td>
                ${safe(employee["الاسم"])}
            </td>


            <td>
                ${safe(employee["القسم"])}
            </td>


            <td>
                ${safe(employee["الوظيفة"])}
            </td>


            <td>
                ${formatNumber(employee["الراتب"])}
            </td>


            <td>
                ${formatDate(employee["تاريخ التعيين"])}
            </td>


            <td>
                ${safe(employee["نوع العقد"])}
            </td>


            <td>
                ${statusBadge(employee["الحالة"])}
            </td>


            <td>

                <div class="actions">


                    <!-- عرض ملف الموظف -->

                    <button
                        class="action view"
                        onclick='openEmployee("${safe(employee["Employee ID"])}")'
                    >
                        👁 عرض
                    </button>


                    <!-- تعديل -->

                    <button
                        class="action edit"
                        onclick='editEmployee(${JSON.stringify(employee)})'
                    >
                        ✏️ تعديل
                    </button>


                    <!-- إنهاء -->

                    <button
                        class="action end"
                        onclick='endEmployee("${safe(employee["Employee ID"])}")'
                    >
                        إنهاء
                    </button>


                </div>

            </td>

        </tr>

    `).join("");

}



// ======================================
// فتح ملف الموظف
// ======================================

function openEmployee(id){

    window.location.href =
        "employee.html?id=" +
        encodeURIComponent(id);

}



// ======================================
// البحث
// ======================================

function searchEmployees(){

    const value =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();


    if(!value){

        renderEmployees(employees);

        return;

    }


    const result =
        employees.filter(employee => {

            return [

                employee["Employee ID"],
                employee["الاسم"],
                employee["القسم"],
                employee["الوظيفة"],
                employee["الهاتف"]

            ]

            .join(" ")
            .toLowerCase()
            .includes(value);

        });


    renderEmployees(result);

}



// ======================================
// إضافة موظف
// ======================================

function openAddEmployee(){

    document
        .getElementById("employeeForm")
        .reset();


    document
        .getElementById("employeeModal")
        .style.display =
        "block";

}


function closeModal(){

    document
        .getElementById("employeeModal")
        .style.display =
        "none";

}



// ======================================
// حفظ الموظف
// ======================================

document
.getElementById("employeeForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const button =
            this.querySelector(
                "button[type='submit']"
            );


        button.disabled = true;

        button.innerText =
            "⏳ جاري الحفظ...";


        const data = {

            action:"addEmployee",

            name:
                document.getElementById("name").value,

            department:
                document.getElementById("department").value,

            position:
                document.getElementById("position").value,

            salary:
                document.getElementById("salary").value,

            hireDate:
                document.getElementById("hireDate").value,

            contractType:
                document.getElementById("contractType").value,

            phone:
                document.getElementById("phone").value,

            address:
                document.getElementById("address").value,

            birthDate:
                document.getElementById("birthDate").value,

            emergencyContact:
                document.getElementById("emergencyContact").value,

            emergencyPhone:
                document.getElementById("emergencyPhone").value,

            nationalId:
                document.getElementById("nationalId").value,

            contractEndDate:
                document.getElementById("contractEndDate").value,

            notes:
                document.getElementById("notes").value

        };


        try{

            const response =
                await fetch(API,{

                    method:"POST",

                    body:JSON.stringify(data)

                });


            const result =
                await response.json();


            if(result.status !== "success"){

                throw new Error(
                    result.message
                );

            }


            closeModal();


            showMessage(
                "✅ تمت إضافة الموظف بنجاح — " +
                result.employeeId,
                "success"
            );


            await loadEmployees();


        }catch(error){

            showMessage(
                "❌ حدث خطأ: " +
                error.message,
                "error"
            );

        }


        button.disabled = false;

        button.innerText =
            "💾 حفظ الموظف";

    }
);



// ======================================
// تعديل مؤقت
// ======================================

function editEmployee(employee){

    alert(
        "✏️ تعديل الموظف\n\n" +
        "الموظف: " +
        employee["الاسم"] +
        "\n\nراح نفعل التعديل بالمرحلة القادمة."
    );

}



// ======================================
// إنهاء الخدمة مؤقت
// ======================================

function endEmployee(id){

    alert(
        "🔴 إنهاء الخدمة\n\n" +
        "الموظف: " +
        id +
        "\n\nراح نفعل إنهاء الخدمة بالمرحلة القادمة."
    );

}



// ======================================
// الرسائل
// ======================================

function showMessage(text,type){

    const message =
        document.getElementById("message");


    message.className =
        "message " + type;


    message.innerText =
        text;


    message.style.display =
        "block";


    setTimeout(()=>{

        message.style.display =
            "none";

    },4000);

}



// ======================================
// أدوات
// ======================================

function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "";

    }


    const number =
        Number(
            String(value)
            .replace(/,/g,"")
        );


    if(isNaN(number)){

        return safe(value);

    }


    return number.toLocaleString("en-US");

}


function formatDate(value){

    if(!value){

        return "";

    }


    const date =
        new Date(value);


    if(isNaN(date)){

        return safe(value);

    }


    return date.toLocaleDateString("en-GB");

}


function statusBadge(status){

    status =
        status || "";


    if(status === "مستمر"){

        return `

            <span class="status active">
                🟢 مستمر
            </span>

        `;

    }


    if(status === "إجازة"){

        return `

            <span class="status leave">
                🟠 إجازة
            </span>

        `;

    }


    if(status === "منتهي الخدمة"){

        return `

            <span class="status inactive">
                🔴 منتهي الخدمة
            </span>

        `;

    }


    return `

        <span class="status">
            ${safe(status)}
        </span>

    `;

}



// ======================================
// تشغيل
// ======================================

loadEmployees();


</script>

</body>

</html>
