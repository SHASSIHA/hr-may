<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>المعاملات - Shassiha HR</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Cairo',sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#ff7a00;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.header h1{
    font-size:22px;
}

.header a{
    color:white;
    text-decoration:none;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.title-box{
    background:white;
    padding:22px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.title-box h2{
    margin-bottom:5px;
}

.title-box p{
    color:#777;
    font-size:13px;
}

.cards{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.icon{
    font-size:42px;
    margin-bottom:10px;
}

.card h3{
    margin-bottom:6px;
}

.card p{
    color:#777;
    font-size:13px;
}

.direct{
    border-top:5px solid #16833b;
}

.leave{
    border-top:5px solid #2878d0;
}

.warning{
    border-top:5px solid #a56a00;
}

.end{
    border-top:5px solid #c62828;
}

.recent{
    background:white;
    border-radius:16px;
    padding:22px;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.recent h3{
    margin-bottom:15px;
}

.empty{
    text-align:center;
    color:#888;
    padding:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
    font-size:13px;
}

th{
    background:#fafafa;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
}

.badge-direct{
    background:#e7f7ed;
    color:#16833b;
}

.badge-leave{
    background:#e8f1ff;
    color:#2878d0;
}

.badge-warning{
    background:#fff4dc;
    color:#a56a00;
}

.badge-end{
    background:#ffe5e5;
    color:#c62828;
}

@media(max-width:700px){

    .header{
        flex-direction:column;
        gap:8px;
        text-align:center;
    }

    table{
        min-width:700px;
    }

    .recent{
        overflow-x:auto;
    }

}

</style>

</head>

<body>


<div class="header">

    <h1>
        📄 المعاملات
    </h1>

    <a href="index.html">
        ← الرئيسية
    </a>

</div>


<div class="container">


    <div class="title-box">

        <h2>
            إدارة معاملات الموظفين
        </h2>

        <p>
            اختر نوع المعاملة التي تريد تنفيذها
        </p>

    </div>


    <div class="cards">


        <!-- مباشرة -->

        <div
        class="card direct"
        onclick="openTransaction('مباشرة')">

            <div class="icon">
                📄
            </div>

            <h3>
                كتاب مباشرة
            </h3>

            <p>
                إصدار وتسجيل كتاب مباشرة للموظف
            </p>

        </div>


        <!-- إجازة -->

        <div
        class="card leave"
        onclick="openTransaction('إجازة')">

            <div class="icon">
                🏖️
            </div>

            <h3>
                إجازة
            </h3>

            <p>
                تسجيل إجازة للموظف
            </p>

        </div>


        <!-- إنذار -->

        <div
        class="card warning"
        onclick="openTransaction('إنذار')">

            <div class="icon">
                ⚠️
            </div>

            <h3>
                إنذار
            </h3>

            <p>
                تسجيل إنذار رسمي للموظف
            </p>

        </div>


        <!-- إنهاء خدمة -->

        <div
        class="card end"
        onclick="openTransaction('إنهاء خدمة')">

            <div class="icon">
                🔴
            </div>

            <h3>
                إنهاء خدمة
            </h3>

            <p>
                تسجيل إنهاء خدمة الموظف
            </p>

        </div>


    </div>


    <!-- آخر المعاملات -->

    <div class="recent">

        <h3>
            📋 آخر المعاملات
        </h3>

        <div id="transactionsList">

            <div class="empty">
                ⏳ جاري تحميل المعاملات...
            </div>

        </div>

    </div>


</div>


<script>


const API =
"https://script.google.com/macros/s/AKfycbw6pnqbRn3VyJvFjk0RGfEt8VXdBkOq2uqooSvxi0onjcUStpJ_hOGNZVPLimRA-ZNAGQ/exec";


// ======================================
// فتح المعاملة
// ======================================

function openTransaction(type){

    const pages = {

        "مباشرة":
            "direct.html",

        "إنهاء خدمة":
            "end.html",

        "إجازة":
            "leave.html",

        "إنذار":
            "warning.html"

    };


    if(pages[type]){

        window.location.href =
            pages[type];

        return;

    }


    alert(
        "📄 " +
        type +
        "\n\nراح نفعّلها بالمرحلة القادمة."
    );

}

// ======================================
// تحميل المعاملات
// ======================================

async function loadTransactions(){

    const box =
        document.getElementById(
            "transactionsList"
        );

    try{

        const response =
            await fetch(

                API,

                {

                    method:"POST",

                    body:JSON.stringify({

                        action:
                            "getTransactions"

                    })

                }

            );


        const data =
            await response.json();


        if(
            data.status !==
            "success"
        ){

            box.innerHTML = `

                <div class="empty">

                    لا توجد معاملات مسجلة حالياً

                </div>

            `;

            return;

        }


        const list =
            data.transactions || [];


        if(!list.length){

            box.innerHTML = `

                <div class="empty">

                    لا توجد معاملات مسجلة حالياً

                </div>

            `;

            return;

        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>التاريخ</th>

                        <th>الموظف</th>

                        <th>نوع المعاملة</th>

                        <th>التفاصيل</th>

                    </tr>

                </thead>

                <tbody>

        `;


        list
        .slice(-20)
        .reverse()
        .forEach(t => {

            html += `

                <tr>

                    <td>
                        ${formatDate(getField(t,["التاريخ","تاريخ"]))}
                    </td>

                    <td>
                        ${safe(getField(t,["اسم الموظف","الاسم"]))}
                    </td>

                    <td>
                        ${transactionBadge(
                            getField(t,["نوع المعاملة","النوع"])
                        )}
                    </td>

                    <td>
                        ${safe(
                            getField(t,["الملاحظات","ملاحظات"])
                        ) || "-"}
                    </td>

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;


        box.innerHTML =
            html;


    }catch(error){

        box.innerHTML = `

            <div class="empty">

                لا توجد معاملات مسجلة حالياً

            </div>

        `;

    }

}


// ======================================
// جلب أول قيمة موجودة من عدة أسماء أعمدة محتملة
// ======================================

function getField(obj, keys){

    for(const key of keys){

        if(
            obj[key] !== undefined &&
            obj[key] !== ""
        ){

            return obj[key];

        }

    }

    return "";

}


// ======================================
// BADGE
// ======================================

function transactionBadge(type){

    let cls =
        "badge";


    if(type === "مباشرة"){

        cls +=
            " badge-direct";

    }

    else if(type === "إجازة"){

        cls +=
            " badge-leave";

    }

    else if(type === "إنذار"){

        cls +=
            " badge-warning";

    }

    else if(type === "إنهاء خدمة"){

        cls +=
            " badge-end";

    }


    return `

        <span class="${cls}">

            ${safe(type)}

        </span>

    `;

}


// ======================================
// DATE
// ======================================

function formatDate(value){

    if(!value)
        return "-";


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return safe(value);

    }


    return date.toLocaleDateString(
        "en-GB"
    );

}


// ======================================
// SAFE
// ======================================

function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ======================================
// START
// ======================================

loadTransactions();

</script>

</body>

</html>
